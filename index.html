<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موزاييك ديكور | تواصل معنا</title>
<meta name="theme-color" content="#33373A">
<meta name="color-scheme" content="light only">
<style>
  @font-face{font-family:"El Messiri";src:url("assets/ElMessiri.ttf") format("truetype");font-weight:400 700;font-display:swap}
  @font-face{font-family:"Hacen";src:url("assets/Hacen.ttf") format("truetype");font-weight:400;font-display:swap}

  :root{
    color-scheme:light only;
    --charcoal:#33373A;
    --ink:#232628;
    --muted:#6A6F73;
    --line:#E6E4DF;
    --gold-dark:#9C6A1E;
    --gold-light:#F2E28A;
    --gold:linear-gradient(135deg,#9C6A1E 0%,#D8B65A 55%,#F2E28A 100%);
    --paper:#FFFFFF;
    --wash:#F4F4F3;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Hacen","El Messiri",system-ui,sans-serif;
    color:var(--ink);background:var(--paper);line-height:1.6;
  }

  /* ---------- الواجهة العلوية ---------- */
  .hero{
    background:#fff url("assets/bg.jpg") center/cover no-repeat;
    display:grid;place-items:center;
    min-height:clamp(300px,52vh,420px);
    padding:32px 24px 24px;
  }
  .hero img{
    width:min(190px,52vw);height:auto;display:block;
  }

  main{max-width:560px;margin:0 auto;padding:8px 22px 56px}

  h2{
    font:700 20px "El Messiri",sans-serif;color:var(--charcoal);
    margin:34px 0 6px;display:flex;align-items:center;gap:12px;
  }
  h2::after{content:"";flex:1;height:2px;background:var(--gold);opacity:.55;border-radius:2px}

  /* ---------- الصفوف ---------- */
  .row{
    width:100%;display:flex;align-items:center;gap:14px;
    padding:15px 2px;border:0;border-bottom:1px solid var(--line);
    background:none;color:inherit;font:inherit;text-align:right;
    text-decoration:none;cursor:pointer;
  }
  .row:last-child{border-bottom:0}
  .row:focus-visible,.btn:focus-visible,.sheet button:focus-visible{outline:3px solid var(--gold-dark);outline-offset:3px;border-radius:10px}
  .label{flex:1;font-size:17px}
  .num{
    font:600 19px "El Messiri",sans-serif;letter-spacing:.06em;
    direction:ltr;color:var(--charcoal);
  }
  .ico{
    flex:none;width:42px;height:42px;border-radius:50%;
    background:var(--gold);display:grid;place-items:center;color:#fff;
  }
  .ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .ico svg .f{fill:currentColor;stroke:none}
  .handle{font:600 18px "El Messiri",sans-serif;direction:ltr;unicode-bidi:plaintext;color:var(--charcoal)}
  .addr{font-size:18px;color:var(--charcoal)}
  @media (hover:hover){.row:hover .num,.row:hover .handle,.row:hover .addr{color:var(--gold-dark)}}

  .btn{
    display:block;width:100%;margin-top:36px;padding:16px;border:0;border-radius:6px;
    background:var(--charcoal);color:#fff;cursor:pointer;
    font:700 18px "El Messiri",sans-serif;
    border-bottom:4px solid transparent;border-image:var(--gold) 1;
  }
  @media (hover:hover){.btn:hover{background:#2A2D30}}

  /* ---------- قائمة الاختيار ---------- */
  dialog.sheet{
    position:fixed;inset:auto 0 0 0;margin:0 auto;
    width:100%;max-width:560px;max-height:none;
    border:0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));
    border-radius:18px 18px 0 0;background:#fff;color:var(--ink);
  }
  dialog.sheet[open]{animation:up .22s ease-out}
  dialog.sheet::backdrop{background:rgba(35,38,40,.55)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}}
  .sheet .who{font-size:15px;color:var(--muted);text-align:center}
  .sheet .big{font:700 24px "El Messiri",sans-serif;direction:ltr;text-align:center;margin:2px 0 18px;letter-spacing:.06em;color:var(--charcoal)}
  .sheet a,.sheet button{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:15px;margin-top:10px;border-radius:8px;
    font:700 18px "El Messiri",sans-serif;text-decoration:none;cursor:pointer;
  }
  .sheet a{background:var(--charcoal);color:#fff;border:0}
  .sheet a.wa{background:var(--gold);color:#2A1D07}
  .sheet button{background:#fff;color:var(--muted);border:1px solid var(--line)}
  .sheet svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<header class="hero">
  <img src="assets/logo.svg" alt="موزاييك ديكور - Mosaic Decor" width="437" height="589">
</header>

<main>
  <h2>أرقام التواصل</h2>
  <div id="phones"></div>

  <h2>تابعنا</h2>
  <a class="row" href="https://www.instagram.com/mosaic.decors/?hl=ar" target="_blank" rel="noopener">
    <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="f" cx="17.2" cy="6.9" r="1.1"/></svg></span>
    <span class="label">إنستغرام</span>
    <span class="handle">mosaic.decors</span>
  </a>
  <a class="row" href="https://www.facebook.com/mosaicdecor1" target="_blank" rel="noopener">
    <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M13.5 21v-7.5h2.6l.5-3.1h-3.1V8.6c0-.9.4-1.6 1.7-1.6h1.5V4.3c-.3 0-1.2-.2-2.3-.2-2.4 0-3.9 1.4-3.9 4v2.4H7.8v3.1h2.7V21h3z"/></svg></span>
    <span class="label">فيسبوك</span>
    <span class="handle">mosaicdecor1</span>
  </a>

  <h2>العنوان</h2>
  <a class="row" href="https://maps.app.goo.gl/9Wsuku8cRm8hpnUe7" target="_blank" rel="noopener">
    <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6.5-5.6 6.5-10.5a6.5 6.5 0 0 0-13 0C5.5 15.400 12 21 12 21z"/><circle cx="12" cy="10.500" r="2.300"/></svg></span>
    <span class="addr">ريف دمشق - دوما - دوار سوق الهال</span>
  </a>

  <button class="btn" id="save" type="button">حفظ جهة الاتصال</button>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheetNum">
  <div class="who" id="sheetWho"></div>
  <div class="big" id="sheetNum"></div>
  <a id="callBtn" href="#">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
    اتصال عبر الهاتف
  </a>
  <a id="waBtn" class="wa" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.800 7L4 20l1.200-4.600A8 8 0 1 1 21 12z"/></svg>
    مراسلة عبر واتساب
  </a>
  <button type="button" id="closeBtn">إلغاء</button>
</dialog>

<script>
/* ===== عدّل الأرقام من هنا فقط (الصيغة المحلية، تبدأ بـ 0) ===== */
const PHONES = [
  ["الصالة الرئيسة", "0987007949"],
  ["مبيعات / جملة",  "0987007951"],
  ["التسويق",        "0987007953"],
  ["قسم المحاسبة",   "0987007952"],
  ["الإدارة",         "0987007950"]
];
const COUNTRY = "963"; // سوريا
/* ================================================================ */

const intl = n => COUNTRY + n.replace(/^0/, "");
const phoneIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';

const sheet = document.getElementById("sheet");
const box = document.getElementById("phones");

PHONES.forEach(([label, num]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "row";
  b.innerHTML = `<span class="ico">${phoneIcon}</span><span class="label"></span><span class="num"></span>`;
  b.querySelector(".label").textContent = label;
  b.querySelector(".num").textContent = num;
  b.addEventListener("click", () => {
    document.getElementById("sheetWho").textContent = label;
    document.getElementById("sheetNum").textContent = num;
    document.getElementById("callBtn").href = "tel:+" + intl(num);
    document.getElementById("waBtn").href = "https://wa.me/" + intl(num);
    sheet.showModal();
  });
  box.appendChild(b);
});

document.getElementById("closeBtn").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
sheet.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setTimeout(() => sheet.close(), 150)));

document.getElementById("save").addEventListener("click", () => {
  const v = ["BEGIN:VCARD", "VERSION:3.0", "FN:موزاييك ديكور", "ORG:موزاييك ديكور (Mosaic Decor)"];
  PHONES.forEach(([label, num], i) => {
    v.push(`item${i+1}.TEL:+${intl(num)}`, `item${i+1}.X-ABLabel:${label}`);
  });
  v.push("URL:https://www.instagram.com/mosaic.decors/",
         "URL:https://www.facebook.com/mosaicdecor1",
         "ADR;TYPE=WORK:;;ريف دمشق - دوما - دوار سوق الهال;;;;",
         "END:VCARD");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v.join("\r\n")], {type: "text/vcard;charset=utf-8"}));
  a.download = "mosaic-decor.vcf";
  document.body.appendChild(a); a.click(); a.remove();
});
</script>
</body>
</html>
